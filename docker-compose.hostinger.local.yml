# Local-build override for the Hostinger Web Console.
# It deliberately replaces remote build contexts used by Docker Manager.
services:
  backend:
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend-demo:
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BASE_PATH: ""

  frontend-admin:
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BASE_PATH: /admin

  whatsapp-relay:
    pull_policy: build
    build:
      context: .
      dockerfile: backend/docker/local-relay.Dockerfile
