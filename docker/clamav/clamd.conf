# Private ClamAV daemon for document ingestion; no host port is published.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Files that are encrypted or exceed scanning limits must not be treated as clean.
AlertEncrypted yes
AlertExceedsMax yes
StreamMaxLength 12M
MaxFileSize 10M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
