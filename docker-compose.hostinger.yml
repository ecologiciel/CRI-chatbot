x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_DB: ${POSTGRES_DB:-cri_platform}
  POSTGRES_USER: ${POSTGRES_USER:-cri_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cri_minio}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
  GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3-flash-preview}
  GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-15}
  RAG_HYBRID_SEARCH_ENABLED: ${RAG_HYBRID_SEARCH_ENABLED:-true}
  ANTIVIRUS_ENABLED: "true"
  ANTIVIRUS_HOST: antivirus
  ANTIVIRUS_PORT: 3310
  ANTIVIRUS_TIMEOUT: 30
  ANTIVIRUS_MAX_SIGNATURE_AGE_DAYS: 7
  EXTRACTION_SERVICE_URL: http://extractor:8080
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_DURABLE_INBOX_ENABLED: ${WHATSAPP_DURABLE_INBOX_ENABLED:-false}
  DOSSIER_NOTIFICATION_OUTBOX_ENABLED: ${DOSSIER_NOTIFICATION_OUTBOX_ENABLED:-false}
  DOSSIER_IMPORT_WORKER_ENABLED: ${DOSSIER_IMPORT_WORKER_ENABLED:-false}
  WHATSAPP_WEBHOOK_MAX_BODY_BYTES: ${WHATSAPP_WEBHOOK_MAX_BODY_BYTES:-1048576}
  WEBHOOK_PROXY_SHARED_SECRET: ${WEBHOOK_PROXY_SHARED_SECRET:-}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  KMS_MASTER_KEY: ${KMS_MASTER_KEY}
  BACKOFFICE_URL: ${BACKOFFICE_URL}

x-source-repository: &source-repository https://github.com/ecologiciel/CRI-chatbot.git#ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af

# Application images run as non-root and do not require Linux capabilities.
# Restrict privilege escalation for the public API, UI and background workers.
x-app-hardening: &app-hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cri_platform}
      POSTGRES_USER: ${POSTGRES_USER:-cri_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [demo-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cri_admin} -d ${POSTGRES_DB:-cri_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 2g

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    networks: [demo-data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 768m

  qdrant:
    image: qdrant/qdrant:v1.12.1
    volumes: [qdrant_data:/qdrant/storage]
    networks: [demo-data]
    healthcheck:
      # The official image intentionally omits curl/wget; check Qdrant's
      # HTTP listener (6333 = 0x18BD) through the kernel socket table.
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 3g

  minio:
    # The official community image was withdrawn from public registries;
    # this pinned, byte-identical upstream mirror keeps the demo reproducible.
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cri_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    networks: [demo-data]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g

  antivirus:
    # The scanner is private and refreshes signatures through its own egress network.
    image: clamav/clamav:1.4@sha256:ac15046e610610347c459afabea6683a52cd041c7a10adf5f050ebb05525d62d
    environment:
      TZ: UTC
      FRESHCLAM_CHECKS: "4"
    volumes:
      - antivirus_data:/var/lib/clamav
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    networks: [demo-antivirus, demo-antivirus-egress]
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 4g

  extractor:
    <<: *app-hardening
    image: chatbot-demo-backend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    command: uvicorn app.services.rag.extractor_service:app --host 0.0.0.0 --port 8080 --no-access-log
    networks: [demo-extractor]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,nodev,size=64m"]
    pids_limit: 32
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    <<: *app-hardening
    image: chatbot-demo-backend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    build:
      context: *source-repository
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-environment
      ENVIRONMENT: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    # Explicit resolvers keep Gemini reachable even when the VPS resolver is
    # transiently unavailable. Docker still resolves service names internally.
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [demo-edge, demo-data, demo-antivirus]
    labels:
      - traefik.enable=true
      - traefik.http.routers.demo-api.rule=Host(`${DEMO_HOSTNAME}`) && PathPrefix(`/api`)
      - traefik.http.routers.demo-api.priority=30
      - traefik.http.routers.demo-api.entrypoints=websecure
      - traefik.http.routers.demo-api.tls.certresolver=le
      - traefik.http.services.demo-api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-m", "app.scripts.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 2g

  ingestion-worker:
    <<: *app-hardening
    stop_grace_period: 660s
    image: chatbot-demo-backend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    environment:
      <<: *backend-environment
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
    command: arq app.workers.ingestion.WorkerSettings
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      backend: { condition: service_healthy }
      antivirus: { condition: service_healthy }
      extractor: { condition: service_healthy }
    # It remains private for data access while gaining outbound HTTPS through
    # the edge network for the configured embedding provider (Gemini).
    networks: [demo-data, demo-edge, demo-antivirus, demo-extractor]
    healthcheck:
      disable: true
    restart: unless-stopped
    mem_limit: 1g

  whatsapp-inbox-worker:
    <<: *app-hardening
    profiles: ["whatsapp-durable"]
    stop_grace_period: 420s
    image: chatbot-demo-backend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    environment:
      <<: *backend-environment
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
    command: arq app.workers.whatsapp_inbox.WorkerSettings
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      backend: { condition: service_healthy }
      antivirus: { condition: service_healthy }
      extractor: { condition: service_healthy }
    networks: [demo-data, demo-edge, demo-antivirus, demo-extractor]
    healthcheck:
      disable: true
    restart: unless-stopped
    mem_limit: 1g

  dossier-import-worker:
    <<: *app-hardening
    profiles: ["dossier-import"]
    stop_grace_period: 660s
    image: chatbot-demo-backend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    environment:
      <<: *backend-environment
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    command: arq app.workers.import_dossier.WorkerSettings
    depends_on:
      backend: { condition: service_healthy }
    networks: [demo-data]
    healthcheck:
      disable: true
    restart: unless-stopped
    mem_limit: 1g

  dossier-outbox-worker:
    <<: *app-hardening
    profiles: ["dossier-outbox"]
    stop_grace_period: 180s
    image: chatbot-demo-backend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    environment:
      <<: *backend-environment
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: arq app.workers.notification_outbox.WorkerSettings
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [demo-data, demo-edge]
    healthcheck:
      disable: true
    restart: unless-stopped
    mem_limit: 768m

  learning-worker:
    <<: *app-hardening
    stop_grace_period: 180s
    image: chatbot-demo-backend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    environment:
      <<: *backend-environment
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
    command: arq app.workers.learning.WorkerSettings
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [demo-data, demo-edge]
    healthcheck:
      disable: true
    restart: unless-stopped
    mem_limit: 768m

  purge-worker:
    <<: *app-hardening
    stop_grace_period: 660s
    image: chatbot-demo-backend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    environment:
      <<: *backend-environment
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: arq app.workers.purge.WorkerSettings
    depends_on:
      backend: { condition: service_healthy }
    networks: [demo-data]
    healthcheck:
      disable: true
    restart: unless-stopped
    mem_limit: 512m

  demo-bootstrap:
    <<: *app-hardening
    image: chatbot-demo-backend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    environment:
      <<: *backend-environment
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      DEMO_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      DEMO_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # The operational ONSSA tenant is provisioned automatically, but its
      # knowledge base is intentionally populated through the back-office.
      DEMO_IMPORT_ONSSA_CORPUS: ${DEMO_IMPORT_ONSSA_CORPUS:-false}
    command: >-
      sh -ec 'alembic upgrade head && python -m app.scripts.bootstrap_demo &&
      python -m app.scripts.import_onssa_demo'
    depends_on:
      backend: { condition: service_healthy }
      ingestion-worker: { condition: service_started }
    networks: [demo-data]
    healthcheck:
      disable: true
    restart: "no"
    mem_limit: 1g

  frontend-demo:
    <<: *app-hardening
    image: chatbot-demo-frontend:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    build:
      context: https://github.com/ecologiciel/CRI-chatbot.git#ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af:frontend
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BASE_PATH: ""
    environment:
      HOSTNAME: 0.0.0.0
    networks: [demo-edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.demo-web.rule=Host(`${DEMO_HOSTNAME}`) && PathPrefix(`/`)
      - traefik.http.routers.demo-web.priority=1
      - traefik.http.routers.demo-web.entrypoints=websecure
      - traefik.http.routers.demo-web.tls.certresolver=le
      - traefik.http.services.demo-web.loadbalancer.server.port=3000
    restart: unless-stopped
    mem_limit: 512m

  frontend-admin:
    <<: *app-hardening
    image: chatbot-demo-admin:ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af
    build:
      context: https://github.com/ecologiciel/CRI-chatbot.git#ed3192b5b1d5ff4e94522eb9de9a5ce1972c04af:frontend
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BASE_PATH: /admin
    environment:
      HOSTNAME: 0.0.0.0
    networks: [demo-edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.demo-admin.rule=Host(`${DEMO_HOSTNAME}`) && PathPrefix(`/admin`)
      - traefik.http.routers.demo-admin.priority=20
      - traefik.http.routers.demo-admin.entrypoints=websecure
      - traefik.http.routers.demo-admin.tls.certresolver=le
      - traefik.http.services.demo-admin.loadbalancer.server.port=3000
    restart: unless-stopped
    mem_limit: 512m

  traefik:
    image: traefik:v3.7.20
    command:
      - --api.dashboard=false
      - --ping=true
      - --entrypoints.traefik.address=:8080
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=demo-edge
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks: [demo-edge]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping=true", "--entrypoints.traefik.address=:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

networks:
  demo-edge:
    name: demo-edge
  demo-data:
    name: demo-data
    internal: true
  demo-antivirus:
    name: chatbot-demo-antivirus
    internal: true
  demo-antivirus-egress:
    name: chatbot-demo-antivirus-egress
  demo-extractor:
    name: chatbot-demo-extractor
    internal: true

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  antivirus_data:
  traefik_letsencrypt:
